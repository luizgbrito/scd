<style>
  /* ============ FONTE MOSVITA ============ */
  @font-face {
    font-family: "Mosvita";
    src: url("assets/fonts/Mosvita.otf") format("opentype");
    font-weight: 100 900;
    font-display: swap;
  }

  :root {
    --bg-0: #07080a;
    --bg-1: #0d0f13;
    --ink: #f5f7fa;
    --ink-dim: #9aa3b0;
    --ink-faint: #5d6573;
    --green: #21b821;
    --green-bright: #2ee02e;
    --green-deep: #169016;
    --red: #ff4d4d;
    --line: rgba(255,255,255,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "Mosvita", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: var(--bg-0);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
  }

  /* ============ GRADIENTE DE FUNDO SUTIL ============ */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(243,144,33,0.12) 0%, rgba(243,144,33,0) 55%),
      radial-gradient(100% 60% at 50% 110%, rgba(243,144,33,0.06) 0%, rgba(243,144,33,0) 60%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 60%, #050608 100%);
  }
  /* grão/textura muito sutil para tirar o "chapado" */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: 0.035;
    background-image: radial-gradient(rgba(255,255,255,0.6) 0.5px, transparent 0.5px);
    background-size: 3px 3px;
  }

  /* ============ ESTRUTURA ============ */
  .page {
    flex: 1 0 auto;
    width: 100%;
    max-width: 920px;
    margin: 0 auto;
    padding: 28px 20px 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ============ HEADER / BARRA DE OFERTA (vermelha) ============ */

    background: #ec1c1c;
    color: #fff;
    text-align: center;
    padding: 16px 20px;
  }
  .offer-inner {
    max-width: 920px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .offer-bar p {
    font-family: "Mosvita", sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.005em;
    line-height: 1.25;
    font-size: 14px;
  }
  .offer-bar s { text-decoration-thickness: 2px; }
  .offer-bar .free { color: #f39021; }
  #clock { font-variant-numeric: tabular-nums; }

  /* ============ VÍDEO VTURB \u2014 sem wrapper visual, embed livre e íntegro ============ */

  /* ============ RODAPÉ ============ */

  footer .logo { height: 34px; width: auto; opacity: 0.95; }
  footer .rights { font-size: 13px; color: var(--ink-dim); letter-spacing: 0.05em; font-weight: 600; }

  <script>
    /* =====================================================================
       CÓDIGO DE DELAY \u2014 pronto para uso, zerado
       ---------------------------------------------------------------------
       Ajuste apenas SECONDS_TO_DISPLAY (em segundos) quando quiser
       sincronizar qualquer elemento futuro com o vídeo (VTurb / smartplayer).
       ===================================================================== */
    var SECONDS_TO_DISPLAY = 0;

    /* =====================================================================
       CONTADOR REGRESSIVO — "ACABA HOJE"
       Conta até o fim do dia atual (23:59:59). Ao virar o dia, recomeça.
       ===================================================================== */
    (function countdown() {
      const clock = document.getElementById('clock');
      const pad = (n) => String(n).padStart(2, '0');

      function tick() {
        const now = new Date();
        const end = new Date(now);
        end.setHours(23, 59, 59, 999);
        let diff = Math.max(0, Math.floor((end - now) / 1000));
        const h = Math.floor(diff / 3600);
        const m = Math.floor((diff % 3600) / 60);
        const s = diff % 60;
        clock.textContent = pad(h) + ':' + pad(m) + ':' + pad(s);
      }
      tick();
      setInterval(tick, 1000);
    })();
  </script>
