<script>
  /* =====================================================================
     CÓDIGO DE DELAY — pronto para uso, zerado
     ---------------------------------------------------------------------
     Ajuste apenas SECONDS_TO_DISPLAY (em segundos) quando quiser
     sincronizar qualquer elemento futuro com o vídeo (VTurb / smartplayer).
     ===================================================================== */

  var SECONDS_TO_DISPLAY = 0;

  /* =====================================================================
     CONTADOR REGRESSIVO — "ACABA HOJE"
     Conta até o fim do dia atual (23:59:59). Ao virar o dia, recomeça.
     ===================================================================== */

  (function countdown() {

    const clock =
      document.getElementById('clock');

    const pad =
      (n) =>
        String(n)
          .padStart(2, '0');

    function tick() {

      const now =
        new Date();

      const end =
        new Date(now);

      end.setHours(
        23,
        59,
        59,
        999
      );

      let diff =
        Math.max(
          0,
          Math.floor(
            (end - now) / 1000
          )
        );

      const h =
        Math.floor(
          diff / 3600
        );

      const m =
        Math.floor(
          (diff % 3600) / 60
        );

      const s =
        diff % 60;

      clock.textContent =
        pad(h) +
        ':' +
        pad(m) +
        ':' +
        pad(s);
    }

    tick();

    setInterval(
      tick,
      1000
    );

  })();
</script>
