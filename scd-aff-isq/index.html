<script>
  /* =====================================================================
     CONTADOR REGRESSIVO - "ACABA HOJE"
     Conta até o fim do dia atual (23:59:59). Ao virar o dia, recomeça.
     ===================================================================== */

  (function countdown() {

    const clock =
      document.getElementById('clock');

    const pad =
      (n) =>
        String(n)
          .padStart(2, '0');

    function tick() {

      const now =
        new Date();

      const end =
        new Date(now);

      end.setHours(
        23,
        59,
        59,
        999
      );

      let diff =
        Math.max(
          0,
          Math.floor(
            (end - now) / 1000
          )
        );

      const h =
        Math.floor(
          diff / 3600
        );

      const m =
        Math.floor(
          (diff % 3600) / 60
        );

      const s =
        diff % 60;

      clock.textContent =
        pad(h) +
        ':' +
        pad(m) +
        ':' +
        pad(s);
    }

    tick();

    setInterval(
      tick,
      1000
    );

  })();
</script>

<!-- Guard contra autoplay indevido dos players Vturb -->
<script>
(function(){
  document.querySelectorAll('vturb-smartplayer').forEach(function(player){
    var userClicked = false;
    player.addEventListener('click', function(){
      userClicked = true;
      var vids = player.querySelectorAll ? player.querySelectorAll('video') : [];
      vids.forEach(function(v){ v.muted = false; });
      if (player.shadowRoot) {
        player.shadowRoot.querySelectorAll('video').forEach(function(v){ v.muted = false; });
      }
    }, true);

    function enforce(video){
      if (userClicked) return;
      if (!video.muted) { video.muted = true; }
      if (!video.paused) { video.pause(); }
    }

    function guard(video){
      if (video.dataset.autoplayGuard) return;
      video.dataset.autoplayGuard = '1';
      enforce(video);
      video.addEventListener('play', function(){ enforce(video); });
      video.addEventListener('playing', function(){ enforce(video); });
      video.addEventListener('timeupdate', function(){ enforce(video); });
      video.addEventListener('volumechange', function(){ enforce(video); });
      var tries = 0;
      var poll = setInterval(function(){
        enforce(video);
        tries++;
        if (userClicked || tries > 200) clearInterval(poll);
      }, 25);
    }

    function scan(root){
      if (!root || !root.querySelectorAll) return;
      root.querySelectorAll('video').forEach(guard);
    }

    scan(player);
    scan(player.shadowRoot);

    var mo = new MutationObserver(function(){
      scan(player);
      scan(player.shadowRoot);
    });
    mo.observe(player, { childList: true, subtree: true });
    if (player.shadowRoot) mo.observe(player.shadowRoot, { childList: true, subtree: true });
  });
})();
</script>
