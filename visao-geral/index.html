  :root{
    --bg:#07080a;
    --bg-card:#101319;
    --hair: rgba(255,255,255,0.08);
    --white:#f5f7fa;
    --muted:#b7bfca;
    --muted-2:#8d96a3;
    --orange:#f39021;
    --orange-light:#f7a94d;
    --orange-deep:#a8681a;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:'Mosvita', Arial, "Helvetica Neue", Helvetica, sans-serif;
    background-color:#07080a;
    background-image:
      radial-gradient(120% 40% at 50% 0%, rgba(243,144,33,.16) 0%, rgba(243,144,33,0) 60%);
    background-repeat:no-repeat;
    color: var(--white);
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px 34px;
    border-bottom: 1px solid var(--hair);
  }
  header img{ height:20px; width:auto; }
  .kicker{
    font-size:10.5px; letter-spacing:2.5px; text-transform:uppercase;
    color: var(--muted-2); font-weight:600;
  }
  .title-block{ padding: 26px 34px 6px; display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:16px; }
  .title-block .eyebrow{
    font-size:10.5px; letter-spacing:3px; text-transform:uppercase;
    color: var(--orange); font-weight:700; margin-bottom:8px;
  }
  .title-block h1{
    font-size:26px; font-weight:800; margin:0; letter-spacing:-0.3px;
  }
  .title-block h1 span{ color:var(--orange); }
  .controls{ display:flex; gap:10px; }
  .btn{
    background: var(--bg-card); border:1px solid var(--hair); color: var(--white);
    font-family:'Mosvita', sans-serif; font-size:11.5px; font-weight:700;
    padding:9px 16px; border-radius:8px; cursor:pointer;
  }
  .btn:hover{ border-color: var(--orange); color: var(--orange-light); }
  .legend{
    display:flex; gap:18px; padding: 4px 34px 8px; flex-wrap:wrap;
  }
  .legend-item{ display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--muted); font-weight:600; }
  .legend-dot{ width:10px; height:10px; border-radius:3px; display:inline-block; }
  .hint{ padding: 0 34px 18px; font-size:12px; color: var(--muted-2); font-style:italic; }
  #topSection{
    overflow:hidden; max-height:400px; opacity:1;
    transition: max-height .28s ease, opacity .2s ease;
  }
  #topSection.collapsed{ max-height:0; opacity:0; }
  #graph{
    width:100%; height:74vh; min-height:520px; margin:0 10px 40px;
    transition: height .28s ease;

// ---------------------------------------------------------------------
// Normaliza (ids, kind default, collapsed default)
// ---------------------------------------------------------------------
let idCounter = 0;
function normalize(node, depth){
  node.id = 'n' + (idCounter++);
  node.depth = depth;
  node.kind = node.kind || 'leaf';
  node.children = node.children || [];
  if(node.collapsed === undefined) node.collapsed = false;
  if(node.done === undefined) node.done = false;
  node.offsetX = 0;
  node.offsetY = 0;
  node.children.forEach(c => normalize(c, depth + 1));
}
normalize(treeData, 0);

// ---------------------------------------------------------------------
// Layout
// ---------------------------------------------------------------------
const ROW_H_GAP = 10;
const COL_W = 250;
const PAD_X = 14;
const MIN_W = 60;
const MAX_TEXT_W = 200;

const measureCanvas = document.createElement('canvas');
const mctx = measureCanvas.getContext('2d');

function fontFor(node){
  const bold = node.kind === 'root' || node.kind === 'A' || node.kind === 'B' || node.kind === 'bold';
  const size = node.depth === 0 ? 13 : (bold ? 12.5 : 12);
  return (bold ? '700 ' : '500 ') + size + 'px Mosvita, Arial, sans-serif';
}

function wrapLabel(node){
  const font = fontFor(node);
  mctx.font = font;
  const words = node.label.split(' ');
  let lines = [];
  let cur = '';
  words.forEach(w => {
    const test = cur ? cur + ' ' + w : w;
    if(mctx.measureText(test).width > MAX_TEXT_W && cur){
      lines.push(cur);
      cur = w;
    } else {
      cur = test;
    }
  });
  if(cur) lines.push(cur);
  return lines.length ? lines : [node.label];
}

function sizeNode(node){
  node.lines = wrapLabel(node);
  mctx.font = fontFor(node);
  const textW = Math.max(...node.lines.map(l => mctx.measureText(l).width));
  node.w = Math.max(MIN_W, textW) + PAD_X * 2;
  node.h = 22 + (node.lines.length - 1) * 14;
  node.children.forEach(sizeNode);
}
sizeNode(treeData);

let cursorY = 0;
function place(node){
  node.x = node.depth * COL_W;
  const visibleChildren = node.collapsed ? [] : node.children;
  if(visibleChildren.length === 0){
    node.y = cursorY + node.h / 2;
    cursorY = node.y + node.h / 2 + ROW_H_GAP;
  } else {
    visibleChildren.forEach(place);
    const ys = visibleChildren.map(c => c.y);
    node.y = ys.reduce((a,b) => a+b, 0) / ys.length;
  }
}

function applyOffsets(node){
  node.x += node.offsetX;
  node.y += node.offsetY;
  node.children.forEach(applyOffsets);
}

  const bounds = [1e9, 1e9, -1e9, -1e9];
  function collectBounds(node){
    bounds[0] = Math.min(bounds[0], node.x - node.w/2);
    bounds[1] = Math.min(bounds[1], node.y - node.h/2);
    bounds[2] = Math.max(bounds[2], node.x + node.w/2);
    bounds[3] = Math.max(bounds[3], node.y + node.h/2);
    if(!node.collapsed) node.children.forEach(collectBounds);
  }
  collectBounds(treeData);
  const margin = 40;
  const vbX = bounds[0]-margin, vbY = bounds[1]-margin;
  const vbW = (bounds[2]-bounds[0])+margin*2, vbH = (bounds[3]-bounds[1])+margin*2;

  let edgesHTML = '';
  let nodesHTML = '';

  function walk(node, topBranch){
    const c = COLORS[node.kind] || COLORS.leaf;
    const isBold = node.kind === 'root' || node.kind === 'A' || node.kind === 'B' || node.kind === 'bold';
    const fsize = node.depth === 0 ? 13 : (isBold ? 12.5 : 12);
    const rx = node.depth === 0 ? node.h/2 : 8;
    const hasChildren = node.children.length > 0;
    const fill = node.done ? c.stroke : c.fill;
    const textColor = node.done ? '#07080a' : c.text;

    nodesHTML += `<g class="node clickable" data-id="${node.id}">`;
    nodesHTML += `<rect x="${(node.x-node.w/2).toFixed(1)}" y="${(node.y-node.h/2).toFixed(1)}" width="${node.w.toFixed(1)}" height="${node.h.toFixed(1)}" rx="${rx}" fill="${fill}" stroke="${c.stroke}" stroke-width="1.3"/>`;
    const lineH = 14;
    const startTy = node.y - ((node.lines.length-1)*lineH)/2 + 4;
    node.lines.forEach((ln, i) => {
      const ty = startTy + i*lineH;
      nodesHTML += `<text x="${node.x.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle" font-size="${fsize}" font-weight="${isBold?700:500}" fill="${textColor}">${esc(ln)}</text>`;
    });
    if(hasChildren){
      const dotX = node.x + node.w/2 - 3;
      const dotY = node.y;
      const symbol = node.collapsed ? '+' : '−';
      nodesHTML += `<g class="toggle-dot" data-id="${node.id}">`;
      nodesHTML += `<circle cx="${dotX.toFixed(1)}" cy="${dotY.toFixed(1)}" r="8" fill="#07080a" stroke="${c.stroke}" stroke-width="1.2"/>`;
      nodesHTML += `<text x="${dotX.toFixed(1)}" y="${(dotY+3.5).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="${c.stroke}">${symbol}</text>`;
      nodesHTML += `</g>`;
    }
    nodesHTML += `</g>`;

    let myBranch = topBranch;
    if(node.depth === 1) myBranch = node.kind;

    if(!node.collapsed){
      node.children.forEach(child => {
        const x1 = node.x + node.w/2, y1 = node.y;
        const x2 = child.x - child.w/2, y2 = child.y;
        const mx = (x1+x2)/2;
        const ecolor = EDGE_COLORS[myBranch] || '#5c4a28';
        edgesHTML += `<path d="M${x1.toFixed(1)},${y1.toFixed(1)} C${mx.toFixed(1)},${y1.toFixed(1)} ${mx.toFixed(1)},${y2.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)}" fill="none" stroke="${ecolor}" stroke-width="1.6" opacity="0.85"/>`;
        walk(child, myBranch);
      });
    }
  }
  walk(treeData, null);

  panWrap.innerHTML = `<svg viewBox="${vbX.toFixed(1)} ${vbY.toFixed(1)} ${vbW.toFixed(1)} ${vbH.toFixed(1)}" width="${vbW.toFixed(0)}" height="${vbH.toFixed(0)}" xmlns="${svgNS}">${edgesHTML}${nodesHTML}</svg>`;

  if(!hasCentered){
    hasCentered = true;
    const cw = graphEl.clientWidth, ch = graphEl.clientHeight;
    panX = Math.max(16, (cw - vbW) / 2);
    panY = Math.max(16, (ch - vbH) / 2);
    applyPan();
  }
}

function findNode(node, id){
  if(node.id === id) return node;
  for(const c of node.children){
    const r = findNode(c, id);
    if(r) return r;
  }
  return null;
}

// ---------------------------------------------------------------------
// Arrastar e soltar: fundo (pan) e blocos individuais (posição livre)
// ---------------------------------------------------------------------
const DRAG_THRESHOLD = 4;
let dragState = null;
let suppressNextClick = false;

graphEl.addEventListener('mousedown', (e) => {
  if(e.button !== 0) return;
  const toggleEl = e.target.closest('.toggle-dot');
  if(toggleEl) return; // o toggle-dot só reage a clique, não arrasta
  const nodeEl = e.target.closest('.node');
  if(nodeEl){
    const node = findNode(treeData, nodeEl.getAttribute('data-id'));
    if(node){
      dragState = {
        type: 'node', node,
        startX: e.clientX, startY: e.clientY,
        startOffX: node.offsetX, startOffY: node.offsetY,
        moved: false,
      };
      e.preventDefault();
    }
    return;
  }
  // clique no fundo (fora de qualquer bloco): pan do canvas inteiro
  dragState = {
    type: 'pan',
    startX: e.clientX, startY: e.clientY,
    startPanX: panX, startPanY: panY,
    moved: false,
  };
  graphEl.classList.add('panning');
  e.preventDefault();
});

document.addEventListener('mousemove', (e) => {
  if(!dragState) return;
  const dx = e.clientX - dragState.startX;
  const dy = e.clientY - dragState.startY;
  if(!dragState.moved && (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)){
    dragState.moved = true;
  }
  if(!dragState.moved) return;

  if(dragState.type === 'node'){
    dragState.node.offsetX = dragState.startOffX + dx;
    dragState.node.offsetY = dragState.startOffY + dy;
    renderAll();
  } else if(dragState.type === 'pan'){
    panX = dragState.startPanX + dx;
    panY = dragState.startPanY + dy;
    applyPan();
  }
});

document.addEventListener('mouseup', () => {
  if(!dragState) return;
  if(dragState.moved && dragState.type === 'node'){
    suppressNextClick = true; // evita que o "click" logo em seguida alterne colapso/marcação
  }
  graphEl.classList.remove('panning');
  dragState = null;
});

// Também permite mover a visão com o scroll do mouse / trackpad, além do arrasto
graphEl.addEventListener('wheel', (e) => {
  e.preventDefault();
  panX -= e.deltaX;
  panY -= e.deltaY;
  applyPan();
}, { passive: false });

graphEl.addEventListener('click', (e) => {
  if(suppressNextClick){ suppressNextClick = false; return; }
  const g = e.target.closest('[data-id]');
  if(!g) return;
  const node = findNode(treeData, g.getAttribute('data-id'));
  if(!node) return;
  if(node.children.length > 0){
    node.collapsed = !node.collapsed;
  } else {
    node.done = !node.done;
  }
  renderAll();
});

function setCollapsedAll(node, val){
  if(node.children.length > 0) node.collapsed = val;
  node.children.forEach(c => setCollapsedAll(c, val));
}
document.getElementById('expandAll').addEventListener('click', () => {
  setCollapsedAll(treeData, false);
  renderAll();
});
document.getElementById('collapseAll').addEventListener('click', () => {
  setCollapsedAll(treeData, true);
  treeData.collapsed = false; // mantém a raiz sempre visível/aberta
  renderAll();
});
document.getElementById('recenter').addEventListener('click', () => {
  hasCentered = false;
  renderAll();
});
function resetOffsets(node){
  node.offsetX = 0;
  node.offsetY = 0;
  node.children.forEach(resetOffsets);
}
document.getElementById('resetPositions').addEventListener('click', () => {
  resetOffsets(treeData);
  hasCentered = false;
  renderAll();
});

const topSection = document.getElementById('topSection');
const toggleSectionBtn = document.getElementById('toggleSection');
toggleSectionBtn.addEventListener('click', () => {
  const collapsed = topSection.classList.toggle('collapsed');
  document.body.classList.toggle('panel-collapsed', collapsed);
  toggleSectionBtn.textContent = collapsed ? 'Mostrar Painel ▾' : 'Ocultar Painel ▴';
  hasCentered = false;
  // espera a transição de altura do #graph terminar antes de recentralizar
  setTimeout(renderAll, 300);
});

if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(renderAll);
} else {
  renderAll();
}
renderAll();
</script>
</body>
</html>
